[package]
name = "rec_core"
version = "0.1.0"
edition = "2021"
description = "Core audio engine, playlist logic, and storage traits for rec_bag"

[features]
default = ["audio"]
audio = ["dep:rodio", "dep:symphonia", "dep:symphonia-bundle-mp3", "dep:symphonia-bundle-flac"]

[dependencies]
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"], optional = true }
symphonia = { version = "0.5", optional = true }
symphonia-bundle-mp3 = { version = "0.5", optional = true }
symphonia-bundle-flac = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2.0.0"
lofty = "0.22.4"
libsql = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
nucleo-matcher = "0.3"

[dev-dependencies]
tempfile = "3.23.0"

