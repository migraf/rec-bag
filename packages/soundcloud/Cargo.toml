[package]
name = "soundcloud"
version = "0.1.0"
edition = "2021"
description = "SoundCloud catalog connector for rec_bag"

[dependencies]
rec_core = { path = "../core", default-features = false }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.48.0", features = ["time"] }
url = "2.5"
uuid = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
futures = "0.3"

[dev-dependencies]
rec_core = { path = "../core", default-features = false, features = ["test-support"] }
tokio = { version = "1.48.0", features = ["macros", "rt"] }
