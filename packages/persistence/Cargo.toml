[package]
name = "rec_persistence"
version = "0.1.0"
edition = "2021"
description = "Turso-backed catalog persistence and migrations for rec_bag"

[dependencies]
rec_core = { path = "../core", default-features = false }
rec_sync = { path = "../sync" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v5"] }
# Turso is the SQLite-compatible engine used for local catalogs and migrations.
turso = { version = "0.7.2", default-features = false }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
