[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/export",
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# workspace
rec_core = { path = "packages/core" }
export = { path = "packages/export" }
ui = { path = "packages/ui" }
api = { path = "packages/api" }
