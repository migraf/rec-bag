[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/persistence",
    "packages/sync",
    "packages/soundcloud",
    "packages/music_storage",
    "packages/music_storage_local",
    "packages/music_storage_google_drive",
    "packages/export",
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/api",
]

[workspace.dependencies]
dioxus = { version = "0.7.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# workspace
rec_core = { path = "packages/core" }
rec_persistence = { path = "packages/persistence" }
export = { path = "packages/export" }
ui = { path = "packages/ui" }
api = { path = "packages/api" }

# Audio decoding and analysis are tight numeric loops: unoptimised, a track takes
# ~45 s to analyse instead of ~1 s. Optimise dependencies and the analysis crate
# even in dev builds; the rest of the workspace keeps fast, debuggable builds.

[profile.dev.package.rec_core]
opt-level = 2
